<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151a28" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="stream1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="stream2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Frosted Rim -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  
  <!-- Specular Top Bevel -->
  <rect x="3" y="3" width="58" height="28" rx="17" fill="url(#specular)" opacity="0.35" />

  <!-- Fluid Cashflow Infinity Ribbon (The Signature Flow Wave) -->
  <path d="M16 26 C16 16 25 13 33 13 C42 13 47 17 47 23 C47 29 40 32 32 32 C23 32 17 35 17 41 C17 47 22 51 31 51 C41 51 47 46 48 40" 
        stroke="url(#stream1)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Inner Specular Light Vector -->
  <path d="M22 23 C27 18 33 18 40 21" 
        stroke="url(#stream2)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Radiant Light Token -->
  <circle cx="42" cy="21" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="42" cy="21" r="1.8" fill="#38bdf8" />
</svg>
